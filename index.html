<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trump Elon Rocket - Arcade Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="hud">
            <div id="score">SCORE: 0</div>
            <div id="highScore">HIGH: 0</div>
            <div id="level">LEVEL: 1</div>
        </div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="gameOver" class="hidden">
            <div class="gameOverContent">
                <h1>GAME OVER</h1>
                <p>FINAL SCORE: <span id="finalScore">0</span></p>
                <p>LEVEL REACHED: <span id="levelReached">1</span></p>
                <button onclick="location.reload()">PLAY AGAIN</button>
            </div>
        </div>
        <div id="startScreen" class="startScreen">
            <div class="startContent">
                <h1>🚀 TRUMP ELON ROCKET 🚀</h1>
                <p>Jump over obstacles with the dynamic duo!</p>
                <div class="controls">
                    <p>CONTROLS: SPACEBAR or UP ARROW to jump</p>
                    <p>AVOID obstacles and survive as long as you can!</p>
                </div>
                <button onclick="startGame()">START GAME</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
